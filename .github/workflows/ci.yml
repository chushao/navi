name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: swift test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Select Xcode (macos-14)
        if: matrix.os == 'macos-14'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcrun -sdk macosx swift --version

      - name: Build (including tests)
        run: swift build --build-tests

      - name: Test
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee /tmp/swift_test_output.txt
          grep -qE 'Test run with [1-9][0-9]* tests? passed' /tmp/swift_test_output.txt || {
            echo '::error::Zero tests executed — swift-testing not discovered (toolchain regression?)' >&2
            exit 1
          }
